[build-system]
# Build with whatever torch the parent environment provides to avoid ABI mismatches
requires = ["setuptools", "torch"]
build-backend = "setuptools.build_meta"

[project]
name = "lietorch"
version = "0.3"
description = "Lie Groups for PyTorch (updated for pytorch>2.6 and python>=3.11)"
authors = [
    { name="teedrz", email="?@gmail.com" }
]
license = { text = "BSD-3-Clause" }
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    # Match the parent env's torch; keep a lower bound for features used
    "torch>=2.6",
    "numpy<2",
]
